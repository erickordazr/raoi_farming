[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raoi-farming"
version = "1.0.0"
description = "Simulador de enjambre de robots con el modelo RAOI aplicado a la recolección agrícola (farming)"
readme = "Readme.md"
requires-python = ">=3.10"
authors = [{ name = "Erick de J. Ordaz-Rivas", email = "erick.ordazrv@uanl.edu.mx" }]
dependencies = [
    "numpy>=1.24",
    "pygame>=2.1.3",
    "opencv-python>=4.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.5"]

[project.urls]
Repository = "https://github.com/erickordazr/raoi_farming"

[tool.setuptools]
packages = ["raoi_simulator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF", "D", "PL"]
ignore = [
    "D203",     # se usa D211: sin línea en blanco antes del docstring de clase
    "D213",     # se usa D212: el resumen va en la primera línea
    "PLR0913",  # las funciones de simulación reciben muchos parámetros del modelo
    "PLR2004",  # tolerancias y umbrales numéricos locales
    "RUF001",   # texto en español y notación matemática (×, –, ·)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Notación del modelo dinámico (C, U, Im, B11, Me22, ...): álgebra de matrices 2x2
# escrita elemento a elemento, varias asignaciones por línea.
"raoi_simulator/dynamics.py" = ["N803", "N806", "E702", "PLR0915"]
"tests/*" = ["D", "PLR2004", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pep8-naming]
# C: matriz de estado del enjambre (N, 6), notación del modelo dinámico.
extend-ignore-names = ["C", "C_*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
